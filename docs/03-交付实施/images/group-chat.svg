<text x="100" y="370" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="start">@客服机器人 支持开专票吗？</text>
<rect x="44" y="406" width="32" height="32" rx="6" fill="#8fb3e8" stroke="none" stroke-width="1"/>
<text x="88" y="420" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#7a8599" font-weight="normal" text-anchor="start">客服机器人</text>
<rect x="88" y="428" width="420" height="34" rx="8" fill="#ffffff" stroke="#e5e8ee" stroke-width="1"/>
<text x="100" y="450" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="start">抱歉，这个问题超出了我的知识范围，已为您记录，稍后由人工补充解答。</text>
