version: "3.8"

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      adapter:
        condition: service_healthy
    networks:
      - csbot

  adapter:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.adapter
    image: cs-bot-adapter:latest
    restart: unless-stopped
    # 默认 root 以直接写宿主 data/logs；安全加固环境可用 CSBOT_UID/CSBOT_GID
    # 切到 65532 并事先 chown -R 65532:65532 data logs。
    user: "${CSBOT_UID:-0}:${CSBOT_GID:-0}"
    env_file:
      - ../.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DATABASE_URL: postgresql://${POSTGRES_USER:-cs}:${POSTGRES_PASSWORD:-cs}@pg:5432/${POSTGRES_DB:-csbot}
      LOG_FILE: /app/logs/adapter.log
      # SaaS：控制面独立进程；数据面不再暴露 /platform
      PLATFORM_ENABLED: "false"
      CONTROL_PLANE_URL: http://control-plane:3100
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:-}
    volumes:
      # 数据持久化：素材、导入、用量快照、上报缓冲
      - ../data:/app/data
      # 日志落盘（无 SSH 时由运维在宿主机查看）
      - ../logs:/app/logs
      # 授权证书（由交付方签发后放入宿主机 license/）
      - ../license:/app/license:ro
    depends_on:
      redis:
        condition: service_healthy
      pg:
        condition: service_healthy
    networks:
      - csbot

  control-plane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.adapter
    image: cs-bot-control-plane:latest
    restart: unless-stopped
    user: "${CSBOT_UID:-0}:${CSBOT_GID:-0}"
    command: ["apps/adapter/dist/control-plane-main.js"]
    ports:
      - "${CONTROL_PLANE_BIND:-0.0.0.0}:3100:3100"

    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cs}:${POSTGRES_PASSWORD:-cs}@pg:5432/${CONTROL_PLANE_DB:-csbot_control}
      PORT: "3100"
      PLATFORM_ENABLED: "true"
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:-}
      PLATFORM_TLS_PROVIDER: ${PLATFORM_TLS_PROVIDER:-file}
      PLATFORM_CERT_DIR: ${PLATFORM_HOST_DATA_DIR:-/opt/cs-bot/data/control}/certs
      PLATFORM_COMPOSE_DIR: ${PLATFORM_HOST_DATA_DIR:-/opt/cs-bot/data/control}/tenants
      DOCKER_HOST: unix:///var/run/docker.sock
      LICENSE_ISSUER: ${LICENSE_ISSUER:-shell}
      LICENSE_ISSUER_BIN: /app/tools/license-issuer/license-issuer.mjs
      LICENSE_ISSUER_KEY: /app/tools/license-issuer/issuer-private.pem
      LICENSE_ISSUER_OUT_DIR: ${PLATFORM_HOST_DATA_DIR:-/opt/cs-bot/data/control}/licenses
      PLATFORM_UPGRADE_SCRIPT: /app/scripts/tenant-upgrade.sh
      LOG_FILE: /app/logs/control-plane.log
    volumes:
      # 控制面数据必须与宿主同路径（容器内调用宿主 docker，compose 卷路径按宿主解析）
      - ${PLATFORM_HOST_DATA_DIR:-/opt/cs-bot/data/control}:${PLATFORM_HOST_DATA_DIR:-/opt/cs-bot/data/control}
      - ../logs/control-plane:/app/logs
      - ../tools/license-issuer:/app/tools/license-issuer:ro
      # 控制面需要调用宿主 docker compose
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_BIN:-/usr/bin/docker}:/usr/local/bin/docker:ro
      - ${DOCKER_COMPOSE_PLUGIN:-/usr/libexec/docker/cli-plugins/docker-compose}:/usr/local/lib/docker/cli-plugins/docker-compose:ro
    depends_on:
      pg:
        condition: service_healthy
    networks:
      - csbot

  fastgpt:
    image: labring/fastgpt:v4.8.17
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_started
      pg:
        condition: service_healthy
    environment:
      DEFAULT_ROOT_PSW: ${FASTGPT_ROOT_PASSWORD:-fastgpt123456}
      FILE_TOKEN: ${FASTGPT_FILE_TOKEN:-filetoken1234567890}
      MONGODB_URI: mongodb://mongo:27017/fastgpt
      PG_URL: postgresql://${POSTGRES_USER:-cs}:${POSTGRES_PASSWORD:-cs}@pg:5432/fastgpt
      REDIS_URL: redis://redis:6379/1
    volumes:
      - fastgpt-data:/data
    networks:
      - csbot

  pg:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cs}
      POSTGRES_DB: ${POSTGRES_DB:-csbot}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../apps/adapter/src/miss/001-miss-record.sql:/docker-entrypoint-initdb.d/01-miss-record.sql:ro
      - ../apps/adapter/src/media/002-asset.sql:/docker-entrypoint-initdb.d/02-asset.sql:ro
      - ../apps/adapter/src/license/003-licensed-chat.sql:/docker-entrypoint-initdb.d/03-licensed-chat.sql:ro
      - ../apps/adapter/src/import/004-import-job.sql:/docker-entrypoint-initdb.d/04-import-job.sql:ro
      - ../apps/adapter/src/import/005-approved-qa.sql:/docker-entrypoint-initdb.d/05-approved-qa.sql:ro
      - ../apps/adapter/src/import/006-import-job-stored-path.sql:/docker-entrypoint-initdb.d/06-import-job-stored-path.sql:ro
      - ../apps/adapter/src/platform/007-tenant.sql:/docker-entrypoint-initdb.d/07-tenant.sql:ro
      - ../apps/adapter/src/import/007-import-pipeline.sql:/docker-entrypoint-initdb.d/08-import-pipeline.sql:ro
      - ../apps/adapter/src/miss/009-miss-media-status.sql:/docker-entrypoint-initdb.d/10-miss-media-status.sql:ro
      - ../apps/adapter/src/media/010-asset-md5.sql:/docker-entrypoint-initdb.d/11-asset-md5.sql:ro
      - ../apps/adapter/src/platform/011-usage-counters.sql:/docker-entrypoint-initdb.d/12-usage-counters.sql:ro
      - ../apps/adapter/src/platform/012-tenant-ports.sql:/docker-entrypoint-initdb.d/13-tenant-ports.sql:ro
      - ./init-control-db.sh:/docker-entrypoint-initdb.d/00-control-db.sh:ro
      - ../apps/adapter/src/platform/007-tenant.sql:/control-migrations/01-tenant.sql:ro
      - ../apps/adapter/src/platform/008-control-plane.sql:/control-migrations/02-control-plane.sql:ro
      - ../apps/adapter/src/platform/011-usage-counters.sql:/control-migrations/03-usage-counters.sql:ro
      - ../apps/adapter/src/platform/012-tenant-ports.sql:/control-migrations/04-tenant-ports.sql:ro
      - ../apps/adapter/src/platform/008-control-plane.sql:/docker-entrypoint-initdb.d/09-control-plane.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cs} -d ${POSTGRES_DB:-csbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - csbot

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - csbot

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - csbot

networks:
  csbot:
    driver: bridge

volumes:
  pg-data:
  mongo-data:
  redis-data:
  fastgpt-data: