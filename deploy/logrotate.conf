/var/log/nginx/*.log {
    daily
    size 100M
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
}

# 适配层落盘日志（LOG_FILE 指向的目录；容器内 /app/logs 或宿主机挂载目录）
/var/log/csbot/*.log /app/logs/*.log {
    daily
    size 100M
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
}
