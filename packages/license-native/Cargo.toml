[package]
name = "license_native"
version = "0.1.0"
edition = "2021"
description = "Rust native license verification module for CS Bot"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"

[build-dependencies]
rand = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"