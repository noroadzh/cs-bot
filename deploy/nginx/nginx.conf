user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    log_format json escape=json '{"ts":"$time_iso8601","status":$status,"req":"$request","ms":$request_time,"ip":"$remote_addr"}';
    access_log /var/log/nginx/access.log json;

    # 仅 TLS 443 对外
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # 企微回调（含企微入口 IP 白名单可在外层 WAF 实现）
        location /wecom/callback {
            proxy_pass http://adapter:3000/wecom/callback;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 5s;   # 3.5s 竞速留余量
        }

        # 管理面
        location /admin/ {
            proxy_pass http://adapter:3000/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # healthz
        location = /healthz {
            proxy_pass http://adapter:3000/healthz;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 默认
        location / {
            proxy_pass http://adapter:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
